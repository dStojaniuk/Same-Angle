version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-patches:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      uv-patches:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-patches:
        patterns: ["*"]
        update-types: ["patch"]
