[project]
name = "same-angle"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pillow==13.0.0"]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
